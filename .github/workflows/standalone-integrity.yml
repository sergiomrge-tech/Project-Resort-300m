name: Standalone integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-assets-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Files, hashes, GUIDs, dependency closure, crop, GPU evidence
        run: python tools/test_standalone.py
